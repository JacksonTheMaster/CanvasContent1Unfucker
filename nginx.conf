user nginx;
worker_processes auto;  # Auto-detect number of cores
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;  # Accept as many connections as possible
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Improved logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Compression settings
    gzip on;
    gzip_comp_level 5;  # Balance between CPU and compression ratio
    gzip_min_length 256;  # Don't compress very small files
    gzip_vary on;  # Add "Vary: Accept-Encoding" header
    gzip_proxied any;  # Compress for all proxy requests
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        text/xml;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;  # Optimize sendfile packets
    tcp_nodelay on;  # Don't buffer data sent, good for small data bursts
    keepalive_timeout 65;
    client_max_body_size 1m;  # Protect against large uploads for static site
    
    server {
        listen 80;
        http2 on;  # Enable HTTP/2 for better performance
        server_name _;  # Catch-all server name

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        
        # Health check endpoint
        location = /status {
            access_log off;
            default_type text/plain;
            add_header Content-Type text/plain;
            return 200 "alive";
        }
        
        # Default route for HTML
        location / {
            root /usr/share/nginx/html/;
            index index.html;
            try_files $uri $uri/ /index.html;  # For SPA fallback if needed
        }
        
        # Static assets with caching
        location ~* \.(js|jpg|jpeg|png|gif|ico|css|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html/;
            expires 30d;  # Cache static assets for 30 days
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }
}